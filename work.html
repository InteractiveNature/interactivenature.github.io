<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Work | Interactive Nature Studio</title>

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700&display=swap" rel="stylesheet" />

    <!-- CSS Files -->
    <link rel="stylesheet" href="css/main.css" />
    <link rel="stylesheet" href="css/components.css" />
    <link rel="stylesheet" href="css/animations.css" />
    <link rel="stylesheet" href="css/responsive.css" />
    <link rel="stylesheet" href="css/work-page.css" />

    <!-- Favicon -->
    <link rel="icon" type="image/x-icon" href="./assets/favicon/IN_favicon.ico" />
</head>
<body>
    <div class="cursor"></div>

    <svg class="bg-lines" width="100%" height="100%" preserveAspectRatio="none">
        <!-- Lines generated by JS -->
    </svg>

    <!-- SVG Definitions for gradients -->
    <svg width="0" height="0" style="position: absolute;">
        <defs>
            <linearGradient id="iridescent-gradient" x1="0%" y1="0%" x2="100%" y2="0%">
                <stop offset="0%" stop-color="#C4D4DB" />
                <stop offset="25%" stop-color="#9AC2C9" />
                <stop offset="50%" stop-color="#B19CD9" />
                <stop offset="75%" stop-color="#93B5C6" />
                <stop offset="100%" stop-color="#BFD8BD" />
            </linearGradient>
        </defs>
    </svg>

    <div id="site-header"></div>

    <main class="work-page">
        <div class="container">
            <div class="section-header">
                <h2>Work</h2>
                <p>A selection of our most innovative spatial experiences and technical productions.</p>
            </div>

            <div class="work-grid-page" id="work-grid-page">
                <!-- Items populated by JS -->
            </div>
        </div>
    </main>

    <footer>
        <div class="container">
            <div class="footer-links">
                <a href="index.html#combined-gallery-services">Services</a>
                <a href="work.html">Work</a>
                <a href="index.html#about">About</a>
                <a href="index.html#contact">Contact</a>
            </div>
            <p>&copy; 2025 Interactive Nature Studio. All rights reserved.</p>
        </div>
    </footer>

    <!-- JavaScript -->
    <script type="module" src="js/main.js"></script>
    <script type="module" src="js/work-page.js"></script>
    <script>
        (function () {
            const select = document.getElementById('mobile-nav-select');
            if (!select) return;

            const syncFromLocation = () => {
                // If we are on work.html, keep dropdown showing Work.
                // Otherwise, if there is a hash, reflect it.
                if (location.pathname.endsWith('/work.html') || location.pathname.endsWith('work.html')) {
                    select.value = 'work.html';
                } else if (location.hash) {
                    select.value = location.pathname.split('/').pop() + location.hash;
                }
            };

            window.addEventListener('hashchange', syncFromLocation, { passive: true });
            syncFromLocation();

            select.addEventListener('change', () => {
                const value = select.value;
                if (!value) return;
                window.location.href = value;
            });
        })();
    </script>
</body>
</html>
